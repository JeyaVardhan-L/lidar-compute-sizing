name: cloud-benchmark

# Measures the same workload on a real ARM server-class cloud VM and on an x86 cloud VM (neither is a
# Raspberry Pi or a drone computer). Manual trigger only. Uses an Oxford Spires window fetched from Hugging
# Face inside the runner (CC BY-NC-SA 4.0, not redistributed). Shared VMs are noisy: every run is repeated
# and the CPU model is recorded, so the hardware is always identified.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Whole-run repeats"
        default: "3"

jobs:
  cloud:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            profile: arm-cloud
          - runner: ubuntu-24.04
            profile: x86-cloud
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + data extra + compiled registration)
        run: python -m pip install -e ".[data,compiled]"
      - name: Unit tests on this architecture
        run: python -B -m unittest discover -s tests
      - name: Record the hardware
        run: |
          mkdir -p artifacts/local   # git-ignored: keeps the tree clean so runs record git.dirty = false
          lscpu > artifacts/local/lscpu.txt
          cat /proc/meminfo | head -3 >> artifacts/local/lscpu.txt
          cat artifacts/local/lscpu.txt
      - name: Fetch a 300-frame Oxford Spires window
        run: python tools/fetch_spires.py --frames 300 --out datasets/oxford-spires/window
      - name: Measure (compiled variants first, then Python)
        run: |
          git status --porcelain   # must be empty: every run records the commit and whether the tree was clean
          for v in c-gicp c-icp optimized baseline; do
            python -m autonav_baseline run --dataset oxford_spires --variant $v --profile ${{ matrix.profile }} \
              --repeats ${{ github.event.inputs.repeats }} --label v2-cloud-${{ matrix.profile }}-$v
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ matrix.profile }}
          path: |
            artifacts/runs/
            artifacts/local/lscpu.txt
